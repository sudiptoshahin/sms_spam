<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spam or Ham</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e9eef4; --panel:#fbfcfe; --ink:#14213d; --muted:#5b6780; --line:#cfd8e4;
  --spam:#d6342c; --spam-bg:#fde4e1; --ham:#127a63; --ham-bg:#d9f1ea; --accent:#14213d; --accent-ink:#fbfcfe;
  --mark:#ffd9d4;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1624; --panel:#18223a; --ink:#e8eefc; --muted:#98a5c2; --line:#2b3857;
    --spam:#ff6b61; --spam-bg:#3a1f26; --ham:#4fd1ae; --ham-bg:#14352f; --accent:#e8eefc; --accent-ink:#0f1624; --mark:#5a2a2f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1624; --panel:#18223a; --ink:#e8eefc; --muted:#98a5c2; --line:#2b3857;
  --spam:#ff6b61; --spam-bg:#3a1f26; --ham:#4fd1ae; --ham-bg:#14352f; --accent:#e8eefc; --accent-ink:#0f1624; --mark:#5a2a2f;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.55 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:40px 20px 56px}
h1{font:800 clamp(34px,6vw,56px)/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.03em;margin:0 0 10px}
.lede{color:var(--muted);max-width:52ch;margin:0 0 32px}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:20px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
label.t{display:block;font:700 15px "Bricolage Grotesque",sans-serif;margin-bottom:10px}
textarea{width:100%;min-height:220px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:14px;background:transparent;color:var(--ink);font:inherit;line-height:1.6}
textarea:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}
.count{color:var(--muted);font-size:14px}
button{font:500 15px "IBM Plex Sans",sans-serif;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 14px}
button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500;padding:11px 22px}
button.go:disabled{opacity:.45;cursor:not-allowed}
.samples{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.samples span{color:var(--muted);font-size:14px;margin-right:4px}
.samples button{font-size:14px;padding:6px 12px;border-radius:99px}
.verdict{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:100%}
.empty{margin:auto;color:var(--muted);max-width:30ch}
.stamp{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;border:6px double currentColor;transform:rotate(-9deg);margin:6px 0 16px}
.stamp b{font:800 44px/1 "Bricolage Grotesque",sans-serif;letter-spacing:.02em}
.stamp.spam{color:var(--spam);background:var(--spam-bg)}
.stamp.ham{color:var(--ham);background:var(--ham-bg)}
.stamp.drop{animation:drop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{transform:rotate(-9deg) scale(1.7);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.stamp.drop{animation:none}}
.say{font:700 20px "Bricolage Grotesque",sans-serif;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.meter{width:100%;text-align:left}
.meter .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .6s ease}
.bar .s{background:var(--spam)}.bar .h{background:var(--ham)}
.flag{width:100%;text-align:left;margin-top:18px;font-size:15px}
.flag h2{font:700 15px "Bricolage Grotesque",sans-serif;margin:0 0 8px}
.flag mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.flag p{margin:0;white-space:pre-wrap;word-break:break-word}
.hist{margin-top:20px}
.hist h2{font:700 16px "Bricolage Grotesque",sans-serif;margin:0 0 10px}
.hist ul{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.tag{flex:none;width:58px;text-align:center;font-weight:500;font-size:13px;border-radius:6px;padding:2px 0}
.tag.spam{background:var(--spam-bg);color:var(--spam)}.tag.ham{background:var(--ham-bg);color:var(--ham)}
.hist li span.m{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist li em{font-style:normal;color:var(--muted);font-size:14px}
.note{color:var(--muted);font-size:13px;margin-top:24px}
</style>
</head>
<body>
<main>
  <h1>Spam or ham?</h1>
  <p class="lede">Paste any message and the model will sort it. Ham is a normal message you actually want.</p>

  <div class="grid">
    <section class="panel" aria-label="Message input">
      <label class="t" for="msg">Message to check</label>
      <textarea id="msg" placeholder="Paste an email or SMS here…"></textarea>
      <div class="row">
        <span class="count" id="count">0 words</span>
        <div>
          <button id="clear" type="button">Clear</button>
          <button id="go" class="go" type="button" disabled>Check message</button>
        </div>
      </div>
      <div class="samples">
        <span>Try an example:</span>
        <button type="button" data-s="WINNER!! You have been selected for a free £1000 prize. Claim now by calling 0900 123 4567 – limited time offer, urgent!">Prize message</button>
        <button type="button" data-s="Hey, are we still on for lunch tomorrow? I can book the place near the office if you like.">Lunch plan</button>
        <button type="button" data-s="Your account is suspended. Verify your password at http://secure-login.example now to avoid cancellation.">Account alert</button>
      </div>
    </section>

    <section class="panel verdict" aria-live="polite" id="out">
      <p class="empty">Your verdict will appear here after you check a message.</p>
    </section>
  </div>

  <section class="panel hist" id="histbox" hidden>
    <h2>Recent checks</h2>
    <ul id="hist"></ul>
  </section>

  <p class="note" id="note"></p>
</main>

<script>
/* ---------- Connect your model here ----------
   Set API_URL to your endpoint (e.g. a Flask route that returns
   {"label":"spam"|"ham","confidence":0.97}) and run this page from
   your own server. Until then, a simple demo rule set is used. */
const API_URL = "";

const SPAM_WORDS = ["free","winner","won","prize","claim","urgent","limited","offer","click","cash","call now","congratulations","password","verify","suspended","£","$","guaranteed","bonus","selected","http"];

async function predict(text){
  if(API_URL){
    const r = await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
    const d = await r.json();
    const label = String(d.label).toLowerCase()==="spam"?"spam":"ham";
    return {label, confidence:d.confidence, words:d.words||[]};
  }
  const lower = text.toLowerCase();
  const hits = SPAM_WORDS.filter(w=>lower.includes(w));
  const caps = (text.match(/[A-Z]{4,}/g)||[]).length;
  const bangs = (text.match(/!/g)||[]).length;
  const digits = (text.match(/\d{4,}/g)||[]).length;
  const score = hits.length*1.1 + caps*.8 + Math.min(bangs,3)*.5 + digits*.8 - 1.6;
  const pSpam = 1/(1+Math.exp(-score));
  const label = pSpam>=.5?"spam":"ham";
  return {label, confidence: label==="spam"?pSpam:1-pSpam, words:hits};
}

const $ = id=>document.getElementById(id);
const msg=$("msg"), go=$("go"), out=$("out"), hist=[];
const esc = s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function words(t){return t.trim()?t.trim().split(/\s+/).length:0}
msg.addEventListener("input",()=>{
  const n=words(msg.value);
  $("count").textContent = n+(n===1?" word":" words");
  go.disabled = n===0;
});
$("clear").onclick=()=>{msg.value="";msg.dispatchEvent(new Event("input"));msg.focus()};
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{msg.value=b.dataset.s;msg.dispatchEvent(new Event("input"));run()});
go.onclick=run;
msg.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter")run()});

function highlight(text,list){
  let h=esc(text);
  list.sort((a,b)=>b.length-a.length).forEach(w=>{
    const re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
    h=h.replace(re,"<mark>$1</mark>");
  });
  return h;
}

async function run(){
  const text=msg.value.trim(); if(!text) return;
  go.disabled=true; go.textContent="Checking…";
  try{
    const r=await predict(text);
    const pct=Math.round(r.confidence*100);
    const sp = r.label==="spam"?pct:100-pct;
    const isSpam=r.label==="spam";
    out.innerHTML=`
      <div class="stamp ${r.label} drop" role="img" aria-label="${isSpam?"Spam":"Ham"}"><b>${isSpam?"SPAM":"HAM"}</b></div>
      <p class="say">${isSpam?"This looks like spam":"This looks like a normal message"}</p>
      <p class="sub">${pct}% confident</p>
      <div class="meter">
        <div class="top"><span>Ham ${100-sp}%</span><span>Spam ${sp}%</span></div>
        <div class="bar" aria-hidden="true"><i class="h" style="width:${100-sp}%"></i><i class="s" style="width:${sp}%"></i></div>
      </div>
      ${r.words.length?`<div class="flag"><h2>Suspicious words found</h2><p>${highlight(text,r.words.slice())}</p></div>`:""}`;
    hist.unshift({text,label:r.label,pct});
    if(hist.length>5) hist.pop();
    $("histbox").hidden=false;
    $("hist").innerHTML=hist.map(h=>`<li><span class="tag ${h.label}">${h.label==="spam"?"Spam":"Ham"}</span><span class="m">${esc(h.text)}</span><em>${h.pct}%</em></li>`).join("");
  }catch(e){
    out.innerHTML='<p class="empty">The model could not be reached. Check that your API is running, then try again.</p>';
  }
  go.textContent="Check message"; go.disabled=false;
}
if(!API_URL) $("note").textContent="Demo mode: results come from a simple keyword rule, not your trained model yet.";
</script>
</body>
</html>
